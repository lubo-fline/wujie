<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Three.js 实验室 · 子应用</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: radial-gradient(1200px 600px at 20% -10%, #131a33 0%, #070a14 55%, #05070e 100%);
    color: #e7ecff;
    font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 40px 22px 80px; }
  header h1 { font-size: 26px; margin: 0 0 8px; letter-spacing: 1px; }
  header p { color: #8b96bd; font-size: 13.5px; line-height: 1.8; margin: 0 0 26px; max-width: 760px; }
  .kicker { font-size: 11px; letter-spacing: 5px; color: #5f6c96; margin-bottom: 10px; }

  .floating-back {
    position: fixed; left: 16px; bottom: 16px; z-index: 99;
    padding: 9px 16px; border-radius: 999px; cursor: pointer;
    font-size: 12.5px; letter-spacing: 1px; color: #cfd8ff;
    background: rgba(8,13,28,0.86); border: 1px solid rgba(140,165,255,0.35);
    backdrop-filter: blur(8px); transition: all .2s;
  }
  .floating-back:hover { color: #fff; border-color: rgba(160,190,255,0.7); transform: translateX(-2px); }

  .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .tab {
    padding: 8px 16px; border-radius: 999px; cursor: pointer; font-size: 13px;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(140,165,255,0.16);
    color: #9fabd4; transition: all .2s;
  }
  .tab:hover { color: #e7ecff; border-color: rgba(140,165,255,0.4); }
  .tab.on { background: linear-gradient(135deg, #7c9dff, #b98bff); color: #0a1020; font-weight: 600; border-color: transparent; }

  .stage {
    position: relative; width: 100%; height: 460px; border-radius: 16px; overflow: hidden;
    background: rgba(0,0,0,0.35); border: 1px solid rgba(140,165,255,0.14);
    touch-action: none; cursor: grab;
  }
  .stage:active { cursor: grabbing; }
  .stage canvas { display: block; }
  .stage-hint {
    position: absolute; left: 14px; bottom: 12px; z-index: 2;
    font-size: 11.5px; color: #6b78a3; letter-spacing: .5px; pointer-events: none;
    background: rgba(6,10,22,0.55); padding: 3px 9px; border-radius: 999px;
  }
  .stage-load {
    position: absolute; inset: 0; display: grid; place-content: center;
    font-size: 13px; color: #7b88b3; letter-spacing: 1px;
  }
  .stage-load.gone { display: none; }

  .card {
    background: rgba(255,255,255,0.035); border: 1px solid rgba(140,165,255,0.14);
    border-radius: 16px; padding: 20px 22px; margin-top: 18px;
  }
  .card h3 { margin: 0 0 6px; font-size: 15px; }
  .card .note { color: #8b96bd; font-size: 12.5px; line-height: 1.85; margin: 0 0 16px; }
  .card .note code { color: #a8c6ff; background: rgba(0,0,0,0.35); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  .code {
    display: block; background: rgba(0,0,0,0.45); border: 1px solid rgba(140,165,255,0.12);
    border-radius: 10px; padding: 12px 14px; font-family: 'JetBrains Mono', Consolas, monospace;
    font-size: 12px; color: #a8c6ff; overflow-x: auto; white-space: pre; margin: 0;
  }
  .ctl-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 14px; }
  .ctl { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: #9fabd4; }
  .ctl input[type=range] { width: 120px; accent-color: #7c9dff; }
  .ctl .val { font-family: ui-monospace, monospace; color: #cfd8ff; min-width: 34px; }
  .btn {
    padding: 7px 16px; border-radius: 9px; cursor: pointer; font-size: 12.5px;
    background: rgba(124,157,255,0.14); color: #cfd8ff;
    border: 1px solid rgba(140,165,255,0.3); transition: all .18s;
  }
  .btn:hover { background: rgba(124,157,255,0.26); }
  .btn.on { background: linear-gradient(135deg, #7c9dff, #b98bff); color: #0a1020; font-weight: 600; border-color: transparent; }

  .stat { font-family: ui-monospace, monospace; font-size: 11.5px; color: #7b88b3; margin-left: auto; }

  /* ---- 模型编辑器面板（自定义控件块） ---- */
  .ctl-block { flex: 1 1 100%; display: flex; flex-direction: column; gap: 9px; }
  .panel-h { font-size: 10.5px; letter-spacing: 2.4px; color: #5f6c96; margin: 2px 0 0; }
  .part-list { display: flex; flex-wrap: wrap; gap: 6px; max-height: 88px; overflow-y: auto; }
  .part {
    padding: 4px 10px; border-radius: 7px; cursor: pointer; font-size: 11.5px;
    border: 1px solid rgba(140,165,255,0.18); background: rgba(255,255,255,0.03);
    color: #9fabd4; font-family: ui-monospace, monospace; transition: all .16s;
  }
  .part:hover { color: #e7ecff; border-color: rgba(140,165,255,0.45); }
  .part.on { border-color: #7c9dff; color: #e7ecff; background: rgba(124,157,255,0.2); }
  .part.dirty::after { content: '•'; color: #ffd479; margin-left: 5px; }
  .swatches { display: flex; flex-wrap: wrap; gap: 8px; }
  .swatch {
    width: 26px; height: 26px; border-radius: 8px; cursor: pointer;
    border: 1px solid rgba(255,255,255,0.18); transition: transform .16s, border-color .16s;
  }
  .swatch:hover { transform: translateY(-2px); border-color: rgba(255,255,255,0.5); }
  .out-box {
    margin: 0; padding: 10px 12px; border-radius: 10px; background: rgba(0,0,0,0.45);
    border: 1px solid rgba(140,165,255,0.12); font-family: ui-monospace, monospace;
    font-size: 11.5px; color: #a8c6ff; max-height: 118px; overflow: auto; white-space: pre-wrap;
  }
  .ed-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  @media (max-width: 720px) {
    .stage { height: 340px; }
    .wrap { padding: 26px 16px 70px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <button class="floating-back" id="backHome">← 回主站</button>
  <header>
    <div class="kicker">THREE.JS LAB</div>

  </header>

  <div class="tabs" id="tabs">
    <button class="tab on" data-d="terrain">随机山脉</button>
    <button class="tab" data-d="tunnel">隧道穿梭</button>

  <div class="stage" id="stage">
    <div class="stage-hint" id="hint">拖动旋转 · 滚轮缩放</div>

  <div class="card">
    <h3 id="dTitle">随机山脉</h3>
    <p class="note" id="dNote"></p>
    <div class="ctl-row" id="controls"></div>
    <pre class="code" id="dCode"></pre>
  </div>

  <p style="text-align:center; color:#5f6c96; font-size:12px; margin-top:34px; letter-spacing:2px">
    路小垚 · Three.js 实验室 · 独立子应用，通过微前端接入主站

<script>
  /* ---- 回主站 ---- */
  document.getElementById('backHome').addEventListener('click', () => {
    const w = window.$wujie;
    if (w && w.props && typeof w.props.onBack === 'function') { w.props.onBack(); return; }
    window.location.href = `${window.location.origin}/#/portfolio`;
  });

  const stageEl = document.getElementById('stage');
  const ctlEl = document.getElementById('controls');
  const loadEl = document.getElementById('loading');
  const hintEl = document.getElementById('hint');

  let THREE = null;
  let Reflector = null;
  let EffectComposer = null;
  let RenderPass = null;
  let OutlinePass = null;
  let mergeGeometries = null;
  let GLTFLoader = null;
  /* 自封装工具（lib/*.js）：确定性随机、几何合批、读数条，后面每个 demo 都复用 */
  let createRng = null;
  let GeometryBatch = null;
  let createHud = null;
  let renderer = null;
  let current = null;      // 当前 demo 的三件套 + 更新函数 + 清理函数
  let raf = 0;

  /* ============ 通用：极简轨道控制（自己写，不引 addons） ============ */
  function makeOrbit(camera, dom, opts = {}) {
    const target = opts.target || new THREE.Vector3(0, 0, 0);
    let radius = opts.radius ?? 8;
    let theta = opts.theta ?? 0.7;
    let phi = opts.phi ?? 1.1;
    let dTheta = 0;
    let dPhi = 0;
    let drag = false;
    let lx = 0;
    let ly = 0;

    function update() {
      theta += dTheta;
      phi += dPhi;
      dTheta *= 0.9;
      dPhi *= 0.9;
      phi = Math.max(0.12, Math.min(Math.PI - 0.12, phi));
      camera.position.set(
        radius * Math.sin(phi) * Math.sin(theta),
        radius * Math.cos(phi),
        radius * Math.sin(phi) * Math.cos(theta)
      );
      camera.position.add(target);
      camera.lookAt(target);
    }

    const down = (e) => { drag = true; lx = e.clientX; ly = e.clientY; };
    const move = (e) => {
      if (!drag) return;
      dTheta -= (e.clientX - lx) * 0.0055;
      dPhi -= (e.clientY - ly) * 0.0055;
      lx = e.clientX;
      ly = e.clientY;
    };
    const up = () => { drag = false; };
    const wheel = (e) => {
      e.preventDefault();
      radius = Math.max(opts.min ?? 3, Math.min(opts.max ?? 60, radius * (1 + Math.sign(e.deltaY) * 0.09)));
    };

    dom.addEventListener('pointerdown', down);
    dom.addEventListener('pointermove', move);
    dom.addEventListener('pointerup', up);
    dom.addEventListener('pointerleave', up);
    dom.addEventListener('wheel', wheel, { passive: false });

    update();

    return {
      update,
      dispose() {
        dom.removeEventListener('pointerdown', down);
        dom.removeEventListener('pointermove', move);
        dom.removeEventListener('pointerup', up);
        dom.removeEventListener('pointerleave', up);
        dom.removeEventListener('wheel', wheel);
      },
    };
  }

  /* ============ 通用：释放 ============ */
  function disposeObj(obj) {
    obj.traverse?.((o) => {
      if (o.geometry) o.geometry.dispose();
      const mats = Array.isArray(o.material) ? o.material : (o.material ? [o.material] : []);
      mats.forEach((m) => {
        Object.values(m).forEach((v) => { if (v && v.isTexture) v.dispose(); });
        m.dispose();
      });
    });
  }

  /* ============ 噪声（值噪声 + fbm，够用且没有依赖） ============ */
  function hash(x, y) {
    const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
    return s - Math.floor(s);
  }
  function vnoise(x, y) {
    const xi = Math.floor(x);
    const yi = Math.floor(y);
    const xf = x - xi;
    const yf = y - yi;
    const u = xf * xf * (3 - 2 * xf);
    const v = yf * yf * (3 - 2 * yf);
    const a = hash(xi, yi);
    const b = hash(xi + 1, yi);
    const c = hash(xi, yi + 1);
    const d = hash(xi + 1, yi + 1);
    return a * (1 - u) * (1 - v) + b * u * (1 - v) + c * (1 - u) * v + d * u * v;
  }
  function fbm(x, y, oct = 4) {
    let sum = 0;
    let amp = 0.5;
    let f = 1;
    for (let i = 0; i < oct; i++) {
      sum += amp * vnoise(x * f, y * f);
      f *= 2.03;
      amp *= 0.5;
    }
    return sum;
  }

  /* ============ DEMO 定义 ============ */
  const DEMOS = {
    /* ---------- 1 噪声地形 ---------- */
    terrain: {
      title: '随机山脉 · 顶点抬高',
      hint: '拖动旋转 · 滚轮缩放',
      note: '一个 120×120 分段的平面，把每个顶点按 fbm 噪声抬高，再开启 <code>flatShading</code>，就成了低多边形的硬朗山体。改幅度会重新计算高度——注意它是「改已有顶点」，不是重新创建几何体。',
      code: `const geo = new THREE.PlaneGeometry(70, 70, 120, 120);
geo.rotateX(-Math.PI / 2);              // 平面立起来当地面

// 每个顶点按 fbm 噪声抬高（减 0.42 让山谷沉到海平面以下）
for (let i = 0; i < pos.count; i++) {
  const h = (fbm(x * 0.075, z * 0.075) - 0.42) * amp * 2.8;
  pos.setY(i, h);
  color[i] = heightToColor(h);           // 谷底深蓝 → 山脊亮青
}
pos.needsUpdate = true;
geo.computeVertexNormals();              // 法线重算，否则光照是平的

new THREE.MeshStandardMaterial({ vertexColors: true, flatShading: true });`,
      controls: [
        { type: 'range', label: '幅度', min: 1, max: 10, step: 0.5, value: 5 },
        { type: 'toggle', label: '线框', value: false },
      ],
      init(ctx) {
        const { width, height } = ctx;
        const scene = new THREE.Scene();
        scene.fog = new THREE.Fog(0x070a14, 60, 130);
        const camera = new THREE.PerspectiveCamera(50, width / height, 0.1, 400);

        scene.add(new THREE.HemisphereLight(0x9fc0ff, 0x0a1020, 1.25));
        const dir = new THREE.DirectionalLight(0xffffff, 1.5);
        dir.position.set(18, 26, 12);
        scene.add(dir);

        const geo = new THREE.PlaneGeometry(70, 70, 120, 120);
        geo.rotateX(-Math.PI / 2);
        const pos = geo.attributes.position;
        const base = Float32Array.from(pos.array);

        const colors = new Float32Array(pos.count * 3);
        geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const cLow = new THREE.Color(0x182c66);
        const cMid = new THREE.Color(0x4a6bff);
        const cHigh = new THREE.Color(0x9fe8ff);
        const cTmp = new THREE.Color();

        const mat = new THREE.MeshStandardMaterial({
          vertexColors: true,
          flatShading: true,
          metalness: 0.12,
          roughness: 0.78,
        });
        const mesh = new THREE.Mesh(geo, mat);
        scene.add(mesh);

        function build(amp) {
          for (let i = 0; i < pos.count; i++) {
            const x = base[i * 3];
            const z = base[i * 3 + 2];
            const h = (fbm(x * 0.075 + 12, z * 0.075 + 12, 5) - 0.42) * amp * 2.8
              + (fbm(x * 0.26, z * 0.26, 3) - 0.5) * amp * 0.3;
            pos.setY(i, h);
            // 按海拔上色：谷底深蓝 → 山脊亮青
            const k = Math.max(0, Math.min(1, (h / (amp * 1.6)) + 0.5));
            if (k < 0.55) cTmp.copy(cLow).lerp(cMid, k / 0.55);
            else cTmp.copy(cMid).lerp(cHigh, (k - 0.55) / 0.45);
            colors[i * 3] = cTmp.r;
            colors[i * 3 + 1] = cTmp.g;
            colors[i * 3 + 2] = cTmp.b;
          }
          pos.needsUpdate = true;
          geo.attributes.color.needsUpdate = true;
          geo.computeVertexNormals();
        }
        build(5);

        const orb = makeOrbit(camera, stageEl, { radius: 52, phi: 1.02, theta: 0.7, min: 18, max: 110 });

        return {
          scene,
          camera,
          api: {
            amp(v) { build(Number(v)); },
            wire(on) { mat.wireframe = !!on; },
          },
          update(dt) {
            orb.update();
            mesh.rotation.y += dt * 0.06;
          },
          dispose() { orb.dispose(); disposeObj(scene); },
        };
      },
    },

    /* ---------- 2 隧道穿梭 ---------- */
    tunnel: {
      title: '隧道穿梭 · 循环复用',
      hint: '左右移动鼠标看视差',
      note: '40 个圆环沿 z 轴排开，每帧朝相机方向推进一点，跑出画面就绕回队尾。物体数量不变、不新建也不销毁，所以怎么跑都不会卡——这是所有「无尽通道」的做法。',
      code: `rings.forEach((ring) => {
  ring.position.z += speed;              // 朝相机走
  if (ring.position.z > 8) {              // 出画了
    ring.position.z -= TOTAL;             // 直接绕回队尾
  }
});
// 一盏跟着相机走的点光，把近处的环照亮`,
      controls: [
        { type: 'range', label: '速度', min: 0.2, max: 3.2, step: 0.1, value: 1.2 },
        { type: 'toggle', label: '雾', value: true },
      ],
      init(ctx) {
        const { width, height } = ctx;
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(62, width / height, 0.1, 400);
        camera.position.set(0, 0, 0);

        const fogOn = { v: true };
        scene.fog = new THREE.FogExp2(0x070a14, 0.019);

        const COUNT = 40;
        const GAP = 6;
        const TOTAL = COUNT * GAP;
        const rings = [];
        const colors = [0x7c9dff, 0xb98bff, 0x22d3ee, 0xe879f9];

        for (let i = 0; i < COUNT; i++) {
          const hue = colors[i % colors.length];
          const geo = new THREE.TorusGeometry(5.2, 0.11, 8, 44);
          const mat = new THREE.MeshBasicMaterial({ color: hue, transparent: true, opacity: 0.9 });
          const ring = new THREE.Mesh(geo, mat);
          ring.position.z = -i * GAP + 8;
          ring.rotation.z = i * 0.14;
          rings.push(ring);
          scene.add(ring);
        }

        // 主光：跟着相机，负责近处亮度
        const key = new THREE.PointLight(0x9fc0ff, 40, 40);
        key.position.set(0, 0, 4);
        scene.add(key);
        scene.add(new THREE.AmbientLight(0x2a3766, 1.2));

        let speed = 1.2;
        let lookX = 0;
        let lookY = 0;
        let curX = 0;
        let curY = 0;
        const onMove = (e) => {
          const r = stageEl.getBoundingClientRect();
          lookX = ((e.clientX - r.left) / r.width - 0.5) * 1.4;
          lookY = ((e.clientY - r.top) / r.height - 0.5) * 0.9;
        };
        const onLeave = () => { lookX = 0; lookY = 0; };
        stageEl.addEventListener('pointermove', onMove);
        stageEl.addEventListener('pointerleave', onLeave);

        return {
          scene,
          camera,
          api: {
            speed(v) { speed = Number(v); },
            fog(on) { scene.fog = on ? new THREE.FogExp2(0x070a14, 0.019) : null; },
          },
          update(dt) {
            rings.forEach((r, i) => {
              r.position.z += speed * dt * 18;
              if (r.position.z > 8) r.position.z -= TOTAL;
              r.rotation.z += dt * 0.12;
              r.material.opacity = 0.35 + 0.55 * Math.max(0, 1 - Math.abs(r.position.z) / 60);
            });
            // 指针视差：相机原地小幅转头，隧道看起来在偏
            curX += (lookX - curX) * Math.min(1, dt * 4);
            curY += (lookY - curY) * Math.min(1, dt * 4);
            camera.rotation.y = -curX;
            camera.rotation.x = -curY;
          },
          dispose() {
            stageEl.removeEventListener('pointermove', onMove);
            stageEl.removeEventListener('pointerleave', onLeave);
            disposeObj(scene);
          },
        };
      },
    },

    /* ---------- 3 雨雪粒子 ---------- */
    weather: {
      title: '雨雪粒子 · 一个几何体搞定',
      hint: '拖动旋转 · 滚轮缩放',
      note: '两千个点共用一份 <code>BufferGeometry</code>，速度存在一个普通数组里。每帧只改 y 坐标，出界就回顶部——没有为每个粒子建对象，也就没有 GC 压力。雨和雪的区别只是速度、大小和横向摆动。',
      code: `const pos = new Float32Array(N * 3);     // 位置
const vel = new Float32Array(N);         // 每颗的速度
const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));

// 每帧
pos[i * 3 + 1] -= vel[i] * dt;
if (pos[i * 3 + 1] < -10) pos[i * 3 + 1] = 10;
attr.needsUpdate = true;`,
      controls: [
        { type: 'toggle', label: '下雪（关=下雨）', value: false },
        { type: 'range', label: '密度', min: 0.3, max: 2.2, step: 0.1, value: 1 },
      ],
      init(ctx) {
        const { width, height } = ctx;
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x070a14, 0.012);
        const camera = new THREE.PerspectiveCamera(55, width / height, 0.1, 400);

        const N = 2200;
        const R = 26;
        const H = 22;
        const pos = new Float32Array(N * 3);
        const vel = new Float32Array(N);
        const sway = new Float32Array(N);
        const seed = new Float32Array(N);

        for (let i = 0; i < N; i++) {
          pos[i * 3] = (Math.random() - 0.5) * R * 2;
          pos[i * 3 + 1] = Math.random() * H - 6;
          pos[i * 3 + 2] = (Math.random() - 0.5) * R * 2;
          vel[i] = 0.6 + Math.random() * 0.8;
          sway[i] = Math.random() * Math.PI * 2;
          seed[i] = Math.random();
        }

        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));

        // 圆点贴图：canvas 画一个径向渐变，边缘自然淡出
        const c = document.createElement('canvas');
        c.width = c.height = 64;
        const g2 = c.getContext('2d');
        const grad = g2.createRadialGradient(32, 32, 0, 32, 32, 32);
        grad.addColorStop(0, 'rgba(255,255,255,1)');
        grad.addColorStop(0.4, 'rgba(210,225,255,0.85)');
        grad.addColorStop(1, 'rgba(180,200,255,0)');
        g2.fillStyle = grad;
        g2.fillRect(0, 0, 64, 64);
        const sprite = new THREE.CanvasTexture(c);

        const mat = new THREE.PointsMaterial({
          size: 0.5,
          map: sprite,
          transparent: true,
          depthWrite: false,
          opacity: 0.9,
          blending: THREE.AdditiveBlending,
          color: 0xa8c6ff,
        });
        const points = new THREE.Points(geo, mat);
        scene.add(points);

        scene.add(new THREE.AmbientLight(0x8899cc, 1));

        // 地面一个淡淡的圆，给粒子一个参照
        const floorGeo = new THREE.CircleGeometry(24, 48);
        floorGeo.rotateX(-Math.PI / 2);
        const floor = new THREE.Mesh(
          floorGeo,
          new THREE.MeshBasicMaterial({ color: 0x0b1226, transparent: true, opacity: 0.6 })
        );
        floor.position.y = -6;
        scene.add(floor);

        let snow = false;
        let density = 1;
        const attr = geo.attributes.position;

        return {
          scene,
          camera,
          api: {
            snow(on) {
              snow = !!on;
              mat.color.set(snow ? 0xffffff : 0xa8c6ff);
              mat.size = snow ? 0.85 : 0.42;
              mat.opacity = snow ? 0.95 : 0.75;
            },
            density(v) { density = Number(v); },
          },
          update(dt, t) {
            const n = Math.floor(N * Math.min(1, density));
            for (let i = 0; i < n; i++) {
              const iy = i * 3 + 1;
              if (snow) {
                pos[iy] -= vel[i] * 1.1 * dt;
                pos[i * 3] += Math.sin(t * 1.2 + sway[i]) * 0.5 * dt;
              } else {
                pos[iy] -= vel[i] * 9 * dt;
              }
              if (pos[iy] < -6) {
                pos[iy] = H - 6;
                pos[i * 3] = (Math.random() - 0.5) * R * 2;
                pos[i * 3 + 2] = (Math.random() - 0.5) * R * 2;
              }
            }
            // 超出密度的点移到画面外，避免"关掉"时还在
            for (let i = n; i < N; i++) pos[i * 3 + 1] = -999;
            attr.needsUpdate = true;
            points.rotation.y += dt * 0.02;
          },
          dispose() { disposeObj(scene); },
        };
      },
    },

        const rnd = new Float32Array(N);

        const tmpColor = new THREE.Color();
        for (let i = 0; i < N; i++) {

          orig[i * 3] = x;
          orig[i * 3 + 1] = y;
          orig[i * 3 + 2] = z;
          pos[i * 3] = x;
          pos[i * 3 + 1] = y;
          pos[i * 3 + 2] = z;

          const v = new THREE.Vector3(x, y, z).normalize();
          dir[i * 3] = v.x + (Math.random() - 0.5) * 0.6;
          dir[i * 3 + 1] = v.y + (Math.random() - 0.5) * 0.6;
          dir[i * 3 + 2] = v.z + (Math.random() - 0.5) * 0.6;

          col[i * 3 + 2] = tmpColor.b;

    mirror: {

      code: `const mirror = new Reflector(
  new THREE.PlaneGeometry(64, 64),
  { textureWidth: 1024, textureHeight: 1024, color: 0x8fb4ff }
);
mirror.rotateX(-Math.PI / 2);
scene.add(mirror);

// 内部每帧做的事（简化）
// 1) 反射相机 = 主相机按镜面做镜像
// 2) 斜裁剪平面切掉镜面以下
// 3) 渲染进 renderTarget
// 4) 用 textureMatrix 反算屏幕 UV，贴回平面

// 换清晰度：贴图尺寸绑死在构造参数里，只能重建

mirror.getRenderTarget().dispose();`,
      controls: [
        { type: 'range', label: '镜面亮度', min: 0.2, max: 1.6, step: 0.1, value: 1 },

        let mirror = null;

        function buildMirror(low) {
          if (mirror) {
            scene.remove(mirror);
            mirror.geometry.dispose();
            mirror.material.dispose();
            mirror.getRenderTarget().dispose();
          }
          const size = low ? 256 : 1024;
          mirror = new Reflector(new THREE.PlaneGeometry(64, 64), {

          mesh.userData.baseY = y;

        const v = new THREE.Vector3();
        const s = new THREE.Vector3(1, 1, 1);

        const per = () => Math.ceil(Math.sqrt(count));
        const slot = (i) => {

          const gx = i % p;

            x: (gx - p / 2) * 2.1,
            y: Math.sin(gx * 0.5) * Math.cos(gz * 0.5) * 3.4,
            z: (gz - p / 2) * 2.1,

            inst.instanceMatrix.needsUpdate = true;
            group.add(inst);
            return;

          label = 'BatchedMesh';

            count,
            count * geo.attributes.position.count,
            count * geo.index.count,
            mat
          );
          const gid = bm.addGeometry(geo);
          for (let i = 0; i < count; i++) {
            bm.setMatrixAt(bm.addInstance(gid), mat4At(slot(i)));

            uniform float uSize;
            uniform float uSpeed;
            attribute vec3 aColor;
            attribute float aSeed;
            varying vec3 vColor;
            varying float vFade;
            void main() {
              vColor = aColor;
              vec3 p = position;
              float t = uTime * uSpeed;
              p.y += sin(t * 0.6 + aSeed * 6.283) * 3.2;
              p.x += cos(t * 0.43 + aSeed * 12.566) * 2.6;
              p.z += sin(t * 0.31 + aSeed * 9.42) * 2.6;

            varying float vFade;

// 底层就是这套：视锥体 6 平面 vs 包围球

  .multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);

        );

          },
        },
        update(dt) {
          orb.update();
          const H = 1 / 60;
          let steps = 0;
          if (shared.fixed) {
            acc += dt;
            // 最多补 5 步：帧卡久了不追债，避免死亡螺旋
            while (acc >= H && steps < 5) {
              step(H);
              acc -= H;
              steps += 1;
            }
            if (acc > H * 6) acc = 0;
            lastH = H * 1000;
          } else {
            // 反面教材：步长跟随帧率，帧率一抖就穿模
            const h = Math.min(dt, 0.2);
            step(h);
            steps = 1;
            lastH = h * 1000;
          }
          stepAcc += steps;
          stepClock += dt;
          if (stepClock >= 1) {
            // 每秒统计一次：物理步数 / 真实耗时，固定步长下应该稳定在 60
            stepsPerSec = Math.round(stepAcc / stepClock);
            stepAcc = 0;
            stepClock = 0;
          }
          syncMeshes();
          hud.tick(
            dt,
            `刚体 ${bodies.length} · ${shared.fixed ? '固定 1/60' : `跟随帧率 ${lastH.toFixed(1)}ms`} · ${stepsPerSec} 步/秒`
          );
        },
        dispose() {
          hud.dispose();
          orb.dispose();
          bodies.forEach((b) => b.mat.dispose());
          disposeObj(scene);
        },
      };
    },
  };

      const nw = stageEl.clientWidth;
      const nh = stageEl.clientHeight;
      if (!nw || !nh) return;

      if (current) {
        current.camera.aspect = nw / nh;

  let last = 0;
  function scheduleLoop() {
    cancelAnimationFrame(raf);
    last = 0;
    const loop = (now) => {
      raf = requestAnimationFrame(loop);
      const dt = last ? Math.min(0.05, (now - last) / 1000) : 0.016;
      last = now;
      if (!current || !renderer) return;
      try {
        current.update?.(dt, now / 1000);
        // 有后期处理链的 demo 自己接管渲染
        if (current.render) current.render(dt);
        else renderer.render(current.scene, current.camera);
      } catch (err) {
        console.error('render error', err);
      }
    };
    raf = requestAnimationFrame(loop);
  }

  const tabs = document.getElementById('tabs');
  let currentId = 'terrain';
  tabs.addEventListener('click', (e) => {
    const btn = e.target.closest('.tab');
    if (!btn || !renderer) return;
    tabs.querySelectorAll('.tab').forEach((t) => t.classList.toggle('on', t === btn));
    currentId = btn.dataset.d;
    mount(currentId);
    scheduleLoop();
  });

  // three 加载失败时给出提示，不留白屏
  boot().catch((err) => {
    console.error(err);
    loadEl.textContent = 'Three.js 加载失败：' + (err && err.message ? err.message : err);
  });
</script>
</body>
</html>
