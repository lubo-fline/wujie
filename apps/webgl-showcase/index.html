<!DOCTYPE html>
<html lang="zh-CN">
<head>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2322d3ee'/%3E%3Cstop offset='1' stop-color='%23a855f7'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='url(%23g)' stroke-width='2.5'/%3E%3Cpath d='M6 16h20M16 3c5 6 5 20 0 26M16 3c-5 6-5 20 0 26' fill='none' stroke='url(%23g)' stroke-width='1.6'/%3E%3C/svg%3E" />
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WebGL 3D 精选 · 掘金收藏夹实战合集</title>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/addons/" } }
</script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%;
    background: radial-gradient(1200px 600px at 15% -10%, #0e1a33 0%, #070b16 55%, #04060d 100%);
    color: #e7ecff; font-family: 'Inter','PingFang SC','Microsoft YaHei',sans-serif; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 34px 20px 80px; }
  header h1 { font-size: 25px; margin: 0 0 8px; letter-spacing: .5px; }
  header p { color: #8b96bd; font-size: 13px; line-height: 1.8; margin: 0 0 22px; max-width: 820px; }
  .kicker { font-size: 11px; letter-spacing: 5px; color: #5f6c96; margin-bottom: 9px; }
  .badge { display:inline-block; font-size:11px; color:#7dd3fc; border:1px solid rgba(125,211,252,.35);
    padding:2px 9px; border-radius:999px; margin-left:8px; letter-spacing:.5px; vertical-align:middle; }
  .floating-back { position: fixed; left: 16px; bottom: 16px; z-index: 99; padding: 9px 16px;
    border-radius: 999px; cursor: pointer; font-size: 12.5px; color: #cfd8ff;
    background: rgba(8,13,28,.86); border: 1px solid rgba(140,165,255,.35); backdrop-filter: blur(8px); }
  .floating-back:hover { color:#fff; border-color:rgba(160,190,255,.7); }
  .tabs { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }
  .tab { padding:7px 15px; border-radius:999px; cursor:pointer; font-size:12.5px;
    background:rgba(255,255,255,.04); border:1px solid rgba(140,165,255,.16); color:#9fabd4; transition:.2s; }
  .tab:hover { color:#e7ecff; border-color:rgba(140,165,255,.4); }
  .tab.on { background:linear-gradient(135deg,#7c9dff,#b98bff); color:#0a1020; font-weight:600; border-color:transparent; }
  .grid { display:grid; grid-template-columns: repeat(auto-fill,minmax(232px,1fr)); gap:14px; }
  .card { position:relative; border-radius:14px; overflow:hidden; cursor:pointer;
    background:linear-gradient(160deg,#111a30,#0a1020); border:1px solid rgba(140,165,255,.14); transition:.22s; }
  .card:hover { transform:translateY(-3px); border-color:rgba(150,180,255,.5); box-shadow:0 10px 30px rgba(0,0,0,.4); }
  .thumb { height:120px; position:relative; display:flex; align-items:center; justify-content:center;
    font-size:52px; background:radial-gradient(circle at 50% 40%,rgba(90,120,255,.18),transparent 70%); overflow:hidden; }
  .thumb canvas { width:100%!important; height:100%!important; display:block; }
  .tag { position:absolute; top:9px; left:9px; font-size:10px; padding:2px 8px; border-radius:999px;
    background:rgba(8,13,28,.8); color:#8fd3ff; border:1px solid rgba(125,211,252,.3); }
  .card-body { padding:12px 13px 14px; }
  .card-title { font-size:13.5px; font-weight:600; line-height:1.45; margin:0 0 5px; color:#eef2ff; }
  .card-desc { font-size:11px; color:#8792b8; line-height:1.5; min-height:32px; }
  .card-src { display:inline-block; margin-top:9px; font-size:10.5px; color:#6ea8ff; text-decoration:none; }
  .card-src:hover { text-decoration:underline; }
  .stagebar { display:none; position:fixed; inset:0; z-index:100; background:rgba(3,6,14,.96); backdrop-filter:blur(6px);
    flex-direction:column; padding:22px; }
  .stagebar.open { display:flex; }
  .stage-head { display:flex; align-items:center; gap:16px; margin-bottom:14px; }
  .stage-head h2 { font-size:17px; margin:0; flex:1; }
  .close { cursor:pointer; font-size:13px; padding:8px 16px; border-radius:999px; color:#dbe3ff;
    background:rgba(255,255,255,.06); border:1px solid rgba(140,165,255,.3); }
  .close:hover { background:rgba(255,255,255,.12); }
  .stage { flex:1; min-height:0; border-radius:16px; overflow:hidden; position:relative;
    background:radial-gradient(circle at 50% 45%,#111a30,#050810 70%); border:1px solid rgba(140,165,255,.16); }
  .stage canvas { display:block; width:100%; height:100%; }
  .controls { max-width:900px; width:100%; margin:14px auto 0; display:flex; flex-wrap:wrap; gap:14px 22px;
    align-items:center; justify-content:center; font-size:12px; color:#aab6df; }
  .controls label { display:flex; align-items:center; gap:8px; }
  .controls input[type=range] { width:120px; accent-color:#8b9dff; }
  .stage-hint { position:absolute; left:14px; bottom:12px; font-size:11px; color:#7784ad;
    background:rgba(6,10,22,.6); padding:4px 10px; border-radius:999px; pointer-events:none; }
  .loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:#7c8bb8; font-size:13px; }
</style>
</head>
<body>
<div class="floating-back" onclick="history.back()">← 返回应用</div>
<div class="wrap">
  <header>
    <div class="kicker">JUEJIN COLLECTION · WEBGL</div>
    <h1>WebGL 3D 精选实战合集 <span class="badge" id="cntBadge">21 个可运行场景</span></h1>
    <p>掘金「Three.js/Web3D 实战」+「Three.js 进阶 3D 页面」两收藏夹 39 篇，另加 3 个 AI Skill 复刻（MengTo/Skills）与两个建屋复刻，共提炼 21 个可运行场景。共享渲染舞台，点卡片切换。全部本地 three.js、零构建。每张卡附原文链接。</p>
  </header>
  <div class="tabs" id="tabs"></div>
  <div class="grid" id="grid"></div>
</div>

<div class="stagebar" id="stagebar">
  <div class="stage-head">
    <h2 id="stageTitle">Demo</h2>
    <a id="stageSrc" href="#" target="_blank" style="font-size:12px;color:#6ea8ff;text-decoration:none">查看原文 ↗</a>
    <div class="close" onclick="closeStage()">关闭 ✕</div>
  </div>
  <div class="stage" id="stage">
    <div class="loading" id="stageLoading">正在构建 3D 场景…</div>
  </div>
  <div class="controls" id="controls"></div>
</div>

<script src="demos.js"></script>
<script>
let THREE, curDemo = null, raf = 0, renderer, scene, camera, clock, stageEl;
const GRID = document.getElementById('grid'), TABS = document.getElementById('tabs'), controls = document.getElementById('controls');
let activeCat = '全部';

function initTabs() {
  const cats = ['全部', ...new Set(window.DEMOS.map(d => d.cat))];
  TABS.innerHTML = '';
  cats.forEach(c => {
    const b = document.createElement('div');
    b.className = 'tab' + (c === activeCat ? ' on' : '');
    b.textContent = c;
    b.onclick = () => { activeCat = c; initTabs(); renderGrid(); };
    TABS.appendChild(b);
  });
}
function renderGrid() {
  GRID.innerHTML = '';
  const list = window.DEMOS.filter(d => activeCat === '全部' || d.cat === activeCat);
  document.getElementById('cntBadge').textContent = window.DEMOS.length + ' 个可运行场景';
  list.forEach((d, i) => {
    const c = document.createElement('div'); c.className = 'card';
    c.innerHTML = `<div class="thumb"><span class="tag">${d.tag || d.cat}</span>${d.emoji || '◈'}</div>
      <div class="card-body"><div class="card-title">${d.name}</div>
      <div class="card-desc">${d.desc}</div>
      <a class="card-src" href="${d.url}" target="_blank" onclick="event.stopPropagation()">原文 ↗</a></div>`;
    c.onclick = () => openStage(d);
    GRID.appendChild(c);
  });
}
async function ensureThree() {
  if (THREE) return;
  THREE = await import('three');
}
async function openStage(d) {
  await ensureThree();
  curDemo && curDemo.dispose && curDemo.dispose();
  cancelAnimationFrame(raf);
  document.getElementById('stagebar').classList.add('open');
  document.getElementById('stageTitle').textContent = d.name;
  document.getElementById('stageSrc').href = d.url;
  stageEl = document.getElementById('stage');
  stageEl.querySelectorAll('canvas').forEach(x => x.remove());
  const loading = document.getElementById('stageLoading');
  loading.style.display = 'flex';
  controls.innerHTML = '';
  // 下一帧让布局稳定再取尺寸
  await new Promise(r => setTimeout(r, 30));
  const W = stageEl.clientWidth, H = stageEl.clientHeight;
  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(W, H);
  renderer.shadowMap && (renderer.shadowMap.enabled = true);
  stageEl.insertBefore(renderer.domElement, loading);
  scene = new THREE.Scene();
  scene.background = new THREE.Color(d.bg || 0x070b16);
  camera = new THREE.PerspectiveCamera(d.fov || 50, W / H, 0.1, 2000);
  camera.position.set(0, 2, d.camDist || 20); // 默认机位，场景可自行覆盖或用 orbitControls
  clock = new THREE.Clock();
  try {
    curDemo = await d.build({ THREE, scene, camera, renderer, W, H, controls, addCtl });
    loading.style.display = 'none';
    const animate = () => {
      raf = requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      curDemo && curDemo.update && curDemo.update(t);
      renderer.render(scene, camera);
    };
    animate();
  } catch (e) {
    loading.textContent = '场景构建失败：' + e.message;
    console.error(e);
  }
}
function addCtl(label, min, max, val, step, onChange) {
  const wrap = document.createElement('label');
  wrap.innerHTML = `${label} <input type="range" min="${min}" max="${max}" value="${val}" step="${step}">`;
  const inp = wrap.querySelector('input');
  inp.oninput = () => onChange(parseFloat(inp.value));
  controls.appendChild(wrap);
  onChange(parseFloat(val));
}
function closeStage() {
  document.getElementById('stagebar').classList.remove('open');
  cancelAnimationFrame(raf);
  curDemo && curDemo.dispose && curDemo.dispose();
  curDemo = null;
}
window.addEventListener('resize', () => {
  if (!stageEl || !renderer || !document.getElementById('stagebar').classList.contains('open')) return;
  const W = stageEl.clientWidth, H = stageEl.clientHeight;
  camera.aspect = W / H; camera.updateProjectionMatrix(); renderer.setSize(W, H);
});
initTabs(); renderGrid();
</script>
</body>
</html>
