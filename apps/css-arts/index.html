<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; min-height:100%;
    background: radial-gradient(1100px 620px at 15% -8%, #10261f 0%, #0a0f1c 52%, #06080f 100%);
    color:#e6f5ef; font-family:'Inter','PingFang SC','Microsoft YaHei',sans-serif; }
  .wrap { max-width:1200px; margin:0 auto; padding:38px 22px 90px; }
  .kicker { font-size:11px; letter-spacing:5px; color:#4e7c6a; margin-bottom:10px; }
  header h1 { font-size:29px; margin:0 0 10px; letter-spacing:1px;
    background:linear-gradient(100deg,#6ee7b7,#a78bfa); -webkit-background-clip:text; background-clip:text; color:transparent; }
  header p { color:#8ba79c; font-size:13.5px; line-height:1.85; margin:0 0 8px; max-width:820px; }
  header .stat { display:flex; gap:22px; flex-wrap:wrap; margin-top:18px; }
  header .stat b { display:block; font-size:23px; color:#7fe3bb; }
  header .stat span { font-size:11px; color:#628072; letter-spacing:1px; }
  .tabs { display:flex; flex-wrap:wrap; gap:8px; margin:30px 0 8px; position:sticky; top:0; z-index:20;
    background:linear-gradient(#080d17 72%, transparent); padding:10px 0 16px; }
  .tab { padding:9px 17px; border-radius:999px; cursor:pointer; font-size:13px;
    background:rgba(255,255,255,.04); border:1px solid rgba(110,231,183,.16);
    color:#9dbdb0; transition:all .2s; }
  .tab:hover { color:#e6f5ef; border-color:rgba(110,231,183,.4); }
  .tab.on { background:linear-gradient(135deg,#34d399,#7c6bfa); color:#08130d; font-weight:600; border-color:transparent; }
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:18px; margin-top:18px; }
  @media(max-width:880px){ .grid{ grid-template-columns:1fr; } }
  .card { background:rgba(255,255,255,.035); border:1px solid rgba(110,231,183,.13);
    border-radius:16px; padding:18px 20px 20px; display:flex; flex-direction:column; min-width:0; }
  .card h3 { margin:0 0 4px; font-size:15px; }
  .card .meta { display:flex; gap:8px; align-items:center; margin-bottom:12px; flex-wrap:wrap; }
  .card .num { font-size:11px; color:#08130d; background:linear-gradient(135deg,#34d399,#7c6bfa);
    border-radius:6px; padding:2px 8px; font-weight:700; }
  .card .tag { font-size:10.5px; color:#7fa294; border:1px solid rgba(110,231,183,.18);
    border-radius:99px; padding:2px 9px; }
  .card .desc { color:#94b0a4; font-size:12px; line-height:1.7; margin:0 0 14px; }
  .stage { position:relative; border-radius:12px; background:#0c121d;
    border:1px solid rgba(110,231,183,.1); min-height:190px; overflow:hidden;
    display:flex; align-items:center; justify-content:center; }
  .stage>style{ display:none; }
  .src { display:inline-block; margin-top:12px; font-size:11.5px; color:#6ee7b7; text-decoration:none; }
  .src:hover { text-decoration:underline; }
  .hint { font-size:10.5px; color:#5a7d6e; margin-top:8px; }
  .reslist { display:flex; flex-direction:column; gap:10px; width:100%; }
  .resitem { display:block; padding:11px 13px; background:rgba(255,255,255,.03);
    border:1px solid rgba(110,231,183,.1); border-radius:10px; text-decoration:none; }
  .resitem b { color:#8fe6c4; font-size:12.5px; }
  .resitem .d { color:#829c90; font-size:11px; line-height:1.55; margin-top:3px; }
  .resitem:hover { border-color:rgba(110,231,183,.35); }
</style>
</head>

<div class="wrap">
  <header>
    <div class="kicker">JUJIN COLLECTION · CSS · 48 ARTICLES</div>
    <h1>CSS 创意工坊</h1>
    <p>掘金「CSS」收藏夹 48 篇全部落地：视觉特效、布局图形、动画动效、实用技巧逐篇提炼成可运行 demo，原生 CSS / 零依赖，点开即看；工具库 / 知识点类整理成清单卡片与要点笔记。每个效果附原文链接。</p>

      <div><b id="stArt">48</b><span>篇文章</span></div>

    </div>
